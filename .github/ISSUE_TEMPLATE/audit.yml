name: Audit
description: Record scoped findings, decisions and the changes to apply after approval.
labels: ["audit", "decision:draft"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Follow the [canonical process contract](https://github.com/PoroBotHQ/porotoss/blob/main/CONTRIBUTING.md#canonical-process-items).
        This form prepares the audit. Its owning manager handles any actionable request to Poro under that contract.
  - type: input
    id: topic
    attributes:
      label: Topic
      description: What is being audited? Keep lifecycle state in native fields and labels.
    validations:
      required: true
  - type: input
    id: tracked-by
    attributes:
      label: Tracked by
      description: The owning role.
    validations:
      required: true
  - type: textarea
    id: response
    attributes:
      label: Response
      description: What Poro does and where; after an answer, use none needed and link the decision record.
      value: |
        When the owning manager asks for a decision, tell the Coordinator thread "approve all recommended", or list the exceptions by number. Commenting on this issue alone notifies no one.
    validations:
      required: true
  - type: textarea
    id: findings
    attributes:
      label: Findings
      description: State the audit scope, observation time, counts, evidence and limits.
      value: |
        Scope:
        Counts:
        Findings:
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: Decisions
      description: Use a plain Decision heading, numbered questions and bold recommended answers; explain what happens next.
      value: |
        ## Decision: <question>

        1. <question> **Recommended: <answer>.**

        What happens next:
    validations:
      required: true
  - type: textarea
    id: agent-tier-changes
    attributes:
      label: Agent-tier changes after approval
      description: List the bounded changes the agent will apply after approval, with selectors, preconditions and readbacks.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: Preserve the packet path and its SHA-256, plus relevant evidence links.
      value: |
        Packet path:
        SHA-256:
    validations:
      required: true
